services:
  postgres-velsis-monitoring:
    image: postgres:18.6
    container_name: postgres-velsis-monitoring
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5444:5432"
    volumes:
      - ./db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  monitoring:
    image: renan1994/renandev:spring-monitoring
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-velsis-monitoring:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_ALLOW_CORS: ${APP_ALLOW_CORS}
    ports:
      - "8080:8080"
    depends_on:
      postgres-velsis-monitoring:
        condition: service_healthy
    restart: unless-stopped

  vue-monitoring:
    image: renan1994/renandev:vue-monitoring
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "5173:80"
    depends_on:
      monitoring:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
