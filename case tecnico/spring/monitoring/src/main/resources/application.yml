stream:
    ffmpeg: ${FFMPEG_PATH:ffmpeg}
    directory: ${STREAM_DIRECTORY:./runtime-hls}

spring:
    application:
        name: monitoring

    datasource:
        url: jdbc:postgresql://127.0.0.1:5444/velsis_monitoring
        username: ${POSTGRES_USER}
        password: ${POSTGRES_PASSWORD}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: false

    liquibase:
        enabled: true
        change-log: classpath:db/changelog/db.changelog-master.xml
